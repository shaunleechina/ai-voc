<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分类分析 - 语义匹配数据分析平台</title>
    <style>
        /* ===== 设计变量 ===== */
        :root {
            --primary: #6366f1;
            --primary-dark: #4338ca;
            --primary-light: #eef2ff;
            --success: #10b981;
            --success-dark: #059669;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-dark: #d97706;
            --warning-light: #fffbeb;
            --neutral: #6b7280;
            --neutral-light: #f3f4f6;
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-300: #d1d5db;
            --neutral-500: #6b7280;
            --neutral-600: #4b5563;
            --neutral-700: #374151;
            --neutral-800: #1f2937;
            --neutral-900: #111827;
            --white: #fff;
            --bg: #f5f7fb;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
            --shadow: 0 4px 12px rgba(0,0,0,.08);
            --shadow-lg: 0 12px 32px rgba(0,0,0,.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #1f2937;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ===== 头部 ===== */
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 28px 24px;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -60%; right: -10%;
            width: 420px; height: 420px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        .header-inner { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
        .header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
        .header p { opacity: 0.9; font-size: 0.95rem; margin-top: 6px; font-weight: 400; }

        /* 导航 */
        .nav {
            max-width: 1400px; margin: 0 auto; padding: 0 24px;
            display: flex; gap: 4px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
            margin-top: -20px;
            position: relative; z-index: 5;
            padding: 6px;
            overflow-x: auto;
        }
        .nav-tab {
            flex: 1; min-width: max-content;
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center;
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            font-size: .9rem;
            transition: all .2s;
            white-space: nowrap;
        }
        .nav-tab:hover { background: #eef2ff; color: #4338ca; }
        .nav-tab.active { background: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99,102,241,.35); }

        /* 主容器 */
        .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* 统计卡 */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .stat { background: #fff; border-radius: 12px; padding: 18px 16px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #e5e7eb; }
        .stat b { display: block; font-size: 1.75rem; font-weight: 700; color: #1f2937; }
        .stat span { font-size: .78rem; color: #6b7280; }

        /* 搜索栏 */
        .searchbar { display: flex; gap: 10px; margin-bottom: 24px; }
        .searchbar input { flex: 1; padding: 12px 16px; font-size: .9rem; border: 2px solid #e5e7eb; border-radius: 8px; font-family: inherit; transition: border-color .2s; }
        .searchbar input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px #eef2ff; }
        .searchbar button { padding: 12px 28px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; transition: all .2s; font-family: inherit; }
        .searchbar button:hover { background: #4338ca; transform: translateY(-1px); }

        /* 数据表格 */
        .table-container { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
        .data-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
        .data-table thead { background: #f9fafb; }
        .data-table th { padding: 14px 16px; text-align: left; font-weight: 600; color: #374151; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
        .data-table td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        .data-table tbody tr { transition: background .15s; }
        .data-table tbody tr:last-child td { border-bottom: none; }
        .data-table tbody tr:hover { background: #fafbfc; }
        
        .data-code { font-family: monospace; font-weight: 600; color: #1f2937; font-size: .9rem; }
        .data-source { background: #eef2ff; color: #4338ca; padding: 3px 10px; border-radius: 20px; font-size: .75rem; font-weight: 500; }
        .label-count { font-weight: 600; color: #1f2937; }
        .sentiment-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: .7rem; font-weight: 600; }
        .sentiment-badge.pos { background: #d1fae5; color: #065f46; }
        .sentiment-badge.neg { background: #fee2e2; color: #991b1b; }
        .sentiment-badge.neu { background: #f3f4f6; color: #6b7280; }
        .tags-cell { max-width: 300px; }
        .tag { background: #eef2ff; color: #4338ca; padding: 3px 10px; border-radius: 20px; font-size: .75rem; white-space: nowrap; display: inline-block; margin: 2px 4px 2px 0; }
        .tag.more { background: #f3f4f6; color: #6b7280; }
        .detail-cell { max-width: 350px; }
        .detail-chip { background: #fffbeb; color: #b45309; padding: 3px 10px; border-radius: 20px; font-size: .75rem; white-space: nowrap; display: inline-block; margin: 2px 4px 2px 0; border: 1px solid #fcd34d; }
        .action-btn { padding: 8px 16px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: 500; font-size: .8rem; cursor: pointer; transition: all .2s; white-space: nowrap; }
        .action-btn:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.35); }
        
        /* 响应式表格 */
        @media (max-width: 1200px) {
            .data-table th:nth-child(5), .data-table td:nth-child(5) { display: none; }
            .data-table th:nth-child(6), .data-table td:nth-child(6) { display: none; }
        }
        @media (max-width: 900px) {
            .data-table th:nth-child(4), .data-table td:nth-child(4) { display: none; }
        }
        @media (max-width: 768px) {
            .table-container { border-radius: 0; border-left: none; border-right: none; }
            .data-table { font-size: .75rem; }
            .data-table th, .data-table td { padding: 10px 8px; }
            .tags-cell, .detail-cell { max-width: 150px; overflow: hidden; }
        }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(17,24,39,.6); backdrop-filter: blur(3px); padding: 24px; overflow-y: auto; }
        .modal.active { display: flex; align-items: flex-start; justify-content: center; }
        .modal-box { background: white; border-radius: 14px; width: 100%; max-width: 1000px; box-shadow: 0 20px 40px rgba(0,0,0,.15); overflow: hidden; animation: pop .25s ease; }
        @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #e5e7e9; background: #fafbfc; }
        .modal-head h2 { font-size: 1.25rem; font-weight: 700; color: #1f2937; }
        .modal-x { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: #9ca3af; line-height: 1; }
        .modal-x:hover { color: #1f2937; }
        .modal-body { padding: 20px 24px; max-height: 70vh; overflow-y: auto; }

        /* 明细列表 */
        .detail-filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; }
        .detail-filters select, .detail-filters input { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: .85rem; }
        .detail-filters select { min-width: 180px; }
        .detail-filters input { flex: 1; min-width: 200px; }

        .record-list { display: grid; gap: 12px; }
        .record { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; }
        .record:hover { background: #fafbfc; }
        .record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .rec-code { font-family: monospace; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 5px; font-size: .78rem; }
        .rec-type { background: #d1fae5; color: #059669; padding: 2px 8px; border-radius: 5px; font-size: .75rem; }
        .rec-kw { background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 5px; font-size: .75rem; }
        .field { margin-top: 10px; }
        .field-label { font-weight: 600; color: #374151; font-size: .85rem; display: block; margin-bottom: 4px; }
        .field-val { color: #4b5563; font-size: .9rem; line-height: 1.6; padding: 8px; background: #f9fafb; border-radius: 6px; border-left: 3px solid; }
        .field-val.reason { border-left-color: #ef4444; }
        .viewfull { margin-top: 10px; display: inline-block; padding: 7px 14px; background: #f3f4f6; border-radius: 6px; font-size: .82rem; font-weight: 500; color: #4338ca; cursor: pointer; transition: all .2s; }
        .viewfull:hover { background: #6366f1; color: white; }

        /* 文本详情弹窗 */
        .text-modal-content { max-width: 900px; }
        .text-detail { white-space: pre-wrap; word-break: break-word; line-height: 1.8; padding: 20px; background: #fafbfc; border-radius: 8px; border: 1px solid #e5e7eb; max-height: 60vh; overflow-y: auto; font-size: .95rem; }
        .text-meta { display: flex; gap: 20px; padding: 15px 20px; background: #eef2ff; border-radius: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .text-meta-item { font-size: .85rem; color: #4a5568; }
        .text-meta-item strong { color: #1f2937; }

        .loading { text-align: center; padding: 50px; color: #6b7280; }
        .loading::after { content: ''; display: inline-block; width: 22px; height: 22px; border: 3px solid #e5e7eb; border-top-color: #6366f1; border-radius: 50%; animation: spin .8s linear infinite; margin-left: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 响应式 */
        @media (max-width: 1024px) { .nav { flex-wrap: nowrap; } }
        @media (max-width: 768px) {
            .wrap { padding: 0 16px; }
            .header { padding: 20px 16px; }
            .header h1 { font-size: 1.5rem; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .searchbar { flex-direction: column; align-items: stretch; }
            .searchbar input { min-width: 100%; }
            .searchbar button { width: 100%; }
            .grid { grid-template-columns: 1fr; }
            .nav-tab { max-width: none; padding: 12px 16px; font-size: .8125rem; }
        }

        /* 打印样式 */
        @media print {
            header, .nav, .searchbar, .searchbar button, .modal, .modal-close, .detail-filters { display: none !important; }
            .modal.active { display: block !important; position: static; max-height: none; box-shadow: none; }
            .modal-box { box-shadow: none; border: 1px solid #ccc; }
            body { background: white; }
            .container { max-width: 100%; padding: 0; }
            .content-wrapper { box-shadow: none; border: none; }
            .record-item { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <h1>数据分类分析</h1>
            <p>按数据编号分组查看所有语义匹配标签与原文内容</p>
        </div>
    </header>

    <!-- 导航标签页 -->
    <nav class="nav" role="tablist" aria-label="页面导航">
        <a href="/" class="nav-tab" role="tab" aria-selected="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg> 标签分类
        </a>
        <a href="/data" class="nav-tab active" role="tab" aria-selected="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg> 数据分类
        </a>
        <a href="/element_code" class="nav-tab" role="tab" aria-selected="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg> 元素代码表
        </a>
        <a href="/indicator_code" class="nav-tab" role="tab" aria-selected="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg> 指标代码表
        </a>
        <a href="/evaluation_code" class="nav-tab" role="tab" aria-selected="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 19V6l-4-4-4 4M5 12h14M12 5v14"/>
            </svg> 评价代码表
        </a>
    </nav>

    <div class="wrap">
        <div class="stats" id="stats"></div>

        <div class="searchbar" role="search" aria-label="搜索">
            <input type="text" id="searchInput" placeholder="搜索数据编号、数据来源、标签类型、匹配关键词...">
            <button onclick="doSearch()">搜索</button>
        </div>

        <div class="grid" id="dataGrid"></div>

        <div class="empty" id="emptyState" style="display:none;">暂无数据</div>
    </div>

    <!-- 明细弹窗 -->
    <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <div class="modal-box">
            <div class="modal-head">
                <h2 id="detailModalTitle">明细查询</h2>
                <button class="modal-x" onclick="closeModal('detailModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body" id="detailModalBody"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <!-- 文本详情弹窗 -->
    <div class="modal" id="textModal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle">
        <div class="modal-box" style="max-width:900px;">
            <div class="modal-head">
                <h2 id="textModalTitle">文本详情</h2>
                <button class="modal-x" onclick="closeModal('textModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="text-meta" id="textMeta"></div>
                <div class="text-detail" id="textDetail"></div>
            </div>
        </div>
    </div>

    <script>
        {% raw %}
        let allData = [];
        let filtered = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
            ['detailModal','textModal'].forEach(id => {
                document.getElementById(id).addEventListener('click', e => { if (e.target === this) closeModal(id); });
            });
        });

        async function loadData() {
            try {
                const res = await fetch('/api/data_codes');
                allData = await res.json();
                filtered = allData;
                render();
            } catch (e) {
                console.error('加载失败:', e);
                document.getElementById('dataGrid').innerHTML = '<div class="empty"><h3>加载失败</h3></div>';
            }
        }

        function render() {
            const statsEl = document.getElementById('stats');
            const gridEl = document.getElementById('dataGrid');
            const emptyEl = document.getElementById('emptyState');

            if (!filtered.length) { 
                document.getElementById('dataGrid').style.display='none'; 
                emptyEl.style.display='block'; 
                document.getElementById('stats').innerHTML=''; 
                return; 
            }
            document.getElementById('dataGrid').style.display='block'; 
            emptyEl.style.display='none';

            // 统计
            let total=0, pos=0, neg=0, neu=0, types=new Set(), codes=new Set();
            filtered.forEach(d => {
                total += d.label_count;
                pos += d.sentiments?.[1]?.count||0;
                neg += d.sentiments?.[2]?.count||0;
                neu += d.sentiments?.[0]?.count||0;
                (d.match_types||[]).forEach(m=>types.add(m));
                (d.data_codes||[]).forEach(c=>codes.add(c));
            });
            document.getElementById('stats').innerHTML = `
                <div class="stat"><b>${filtered.length}</b><span>数据编号数</span></div>
                <div class="stat"><b>${total}</b><span>标签总数</span></div>
                <div class="stat"><b style="color:#166534">${pos}</b><span>正向褒义</span></div>
                <div class="stat"><b style="color:#b91c1c">${neg}</b><span>负向贬义</span></div>
                <div class="stat"><b style="color:#6b7280">${neu}</b><span>中性</span></div>
            `;

            // 渲染表格
            document.getElementById('dataGrid').innerHTML = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 160px;">数据编号</th>
                                <th style="width: 100px;">数据来源</th>
                                <th style="width: 100px;">标签数</th>
                                <th>情感分布</th>
                                <th class="tags-cell">匹配类型 (${types.size} 种)</th>
                                <th class="detail-cell">匹配关键词</th>
                                <th style="width: 120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(d => {
                                const pos = d.sentiments?.[1]?.count||0;
                                const neg = d.sentiments?.[2]?.count||0;
                                const neu = d.sentiments?.[0]?.count||0;
                                const tagsHtml = d.match_types.slice(0,6).map(m=>`<span class="tag">${escapeHtml(m)}</span>`).join('');
                                const tagsMore = d.match_types.length>6 ? `<span class="tag more">+${d.match_types.length-6} 更多</span>` : '';
                                const detailsHtml = d.match_details.slice(0,4).map(m=>`<span class="detail-chip">${escapeHtml(m)}</span>`).join('');
                                const detailsMore = d.match_details.length>4 ? `<span class="detail-chip">+${d.match_details.length-4} 更多</span>` : '';
                                return `
                                <tr>
                                    <td><span class="data-code">${escapeHtml(d.data_code)}</span></td>
                                    <td><span class="data-source">${escapeHtml(d.data_source)}</span></td>
                                    <td><span class="label-count">${d.label_count}</span></td>
                                    <td>
                                        ${pos>0?`<span class="sentiment-badge pos">👍 ${pos}</span>`:''}
                                        ${neg>0?`<span class="sentiment-badge neg">👎 ${neg}</span>`:''}
                                        ${neu>0?`<span class="sentiment-badge neu">⚪ ${neu}</span>`:''}
                                    </td>
                                    <td class="tags-cell">${tagsHtml}${tagsMore}</td>
                                    <td class="detail-cell">${detailsHtml}${detailsMore}</td>
                                    <td>
                                        <button class="action-btn" onclick="openLabelsModal('${escapeHtml(d.data_code)}')">查看明细</button>
                                    </td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function doSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!q) { render(); return; }
            const filtered = allData.filter(d => {
                const qLower = q.toLowerCase();
                return d.data_code.toLowerCase().includes(qLower) ||
                       d.data_source.toLowerCase().includes(qLower) ||
                       d.match_types.some(m => m.toLowerCase().includes(qLower)) ||
                       d.data_codes.some(c => c.toLowerCase().includes(qLower));
            });
            this.filtered = filtered;
            render();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function openLabelsModal(dataCode) {
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('detailModalTitle');
            const body = document.getElementById('detailModalBody');
            title.textContent = `数据编号: ${dataCode} - 所有标签`;
            body.innerHTML = '<div class="loading">加载中...</div>';
            modal.classList.add('active');

            try {
                const response = await fetch(`/api/labels/${encodeURIComponent(dataCode)}`);
                const records = await response.json();

                if (records.length === 0) {
                    body.innerHTML = '<div class="empty"><h3>暂无标签</h3></div>';
                    return;
                }

                body.innerHTML = `
                    <div class="record-list">
                        ${records.map(r => `
                            <div class="record">
                                <div class="record-header">
                                    <span class="rec-code">${escapeHtml(r.data_code)}</span>
                                    <span class="rec-type">${escapeHtml(r.match_type)}</span>
                                    <span class="rec-kw">${escapeHtml(r.match_detail || '无')}</span>
                                    <span class="record-sentiment" style="background:${({1:'#f0fdf4',2:'#fef2f2',0:'#f3f4f6'})[r.sentiment]||'#f3f4f6'};color:${({1:'#166534',2:'#b91c1c',0:'#6b7280'})[r.sentiment]||'#6b7280'};padding:4px 10px;border-radius:6px;font-size:0.8rem;font-weight:600;">${({1:'正向褒义',2:'负向贬义',0:'中性'})[r.sentiment]||'未知'}</span>
                                </div>
                                <div class="record-fields" style="margin-top:10px;display:grid;gap:10px;">
                                    <div class="record-field"><label>关键句子:</label><div class="sentence-content" style="color:#4b5563;font-size:0.9rem;line-height:1.6;padding:8px;background:#f9fafb;border-radius:6px;border-left:3px solid #667eea;">${escapeHtml(r.original_sentence||'无')}</div></div>
                                    <div class="record-field"><label>标注原因:</label><div class="reason-content" style="color:#4b5563;font-size:0.9rem;line-height:1.6;padding:8px;background:#f9fafb;border-radius:6px;border-left:3px solid #f59e0b;">${escapeHtml(r.sentiment_reason||'无')}</div></div>
                                </div>
                                <div class="record-text-preview" onclick="openTextModal('${escapeHtml(r.data_code)}')" style="margin-top: 10px; display: inline-block; padding: 7px 14px; background: #f3f4f6; border-radius: 6px; font-size: .82rem; font-weight: 500; color: #4338ca; cursor: pointer; transition: all .2s;">
                                    点击查看完整原文内容 →
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('加载标签失败:', error);
                body.innerHTML = '<div class="empty"><h3>加载失败</h3><p>请重试</p></div>';
            }
        }

        async function openTextModal(dataCode) {
            const modal = document.getElementById('textModal');
            const title = document.getElementById('textModalTitle');
            const meta = document.getElementById('textMeta');
            const detail = document.getElementById('textDetail');
            title.textContent = `数据编号: ${dataCode}`;
            detail.textContent = '加载中...';
            meta.innerHTML = '';
            modal.classList.add('active');
            try {
                const res = await fetch(`/api/text/${encodeURIComponent(dataCode)}`);
                const rec = await res.json();
                if (rec.error) {
                    detail.textContent = '未找到文本内容';
                    return;
                }
                meta.innerHTML = `
                    <div class="text-meta-item"><strong>数据来源:</strong> ${escapeHtml(rec.data_source || '未知')}</div>
                    <div class="text-meta-item"><strong>文本长度:</strong> ${rec.text_length || 0} 字符</div>
                    <div class="text-meta-item"><strong>创建时间:</strong> ${rec.created_at || '未知'}</div>
                `;
                detail.textContent = rec.text_content || '无内容';
            } catch (error) {
                console.error('加载文本失败:', error);
                detail.textContent = '加载失败，请重试';
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        {% endraw %}
    </script>
</body>
</html>
